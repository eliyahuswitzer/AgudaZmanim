name: Update schedule

on:
  schedule:
    # 10:15 and 22:15 UTC = about 6am and 6pm in New Jersey
    - cron: "15 10,22 * * *"
  workflow_dispatch: # adds a "Run workflow" button on GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - run: pip install -r scraper/requirements.txt

      - name: Fetch and parse luach
        run: python scraper/update.py

      - name: Commit new data
        # Runs even if the step above reported missing days, so any partial update is still saved
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --staged --quiet || (git commit -m "Update schedule data" && git push)
